name: Build iPhone app (unsigned IPA)
on:
  push:
    paths: ["ios/**", ".github/workflows/ios.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild -project StickyNotes.xcodeproj -target StickyNotes
          -configuration Release -sdk iphoneos
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
      - run: |
          mkdir Payload
          cp -R build/Release-iphoneos/StickyNotes.app Payload/
          zip -qr StickyNotes.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: StickyNotes-ipa
          path: ios/StickyNotes.ipa
