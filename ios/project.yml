name: StickyNotes
options:
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  StickyNotes:
    type: application
    platform: iOS
    sources: [StickyNotes]
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: Sticky Notes
        UILaunchScreen: {}
        UIAppFonts: [Caveat.ttf]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # The sync server may be plain http
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.jjguve5.stickynotes
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1"
